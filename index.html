<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S. Nicolas Ramirez Villalobos y Austin Morales</title>

    <!-- Fuente personalizada desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            text-align: center;
            font-family: 'Style Script', cursive;
            color: white;
            background-image: url('background.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            transition: background-image 0.5s ease-in-out;
        }

        h1, h2 {
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            margin: 10px 0;
        }

        /* El contenedor del enlace de video será reemplazado por una imagen */
        .video-image {
            display: none; /* Inicialmente está oculto */
            margin-top: 20px;
        }

        .buttons-container {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .buttons-container button {
            padding: 10px 20px;
            font-size: 1.2em;
            font-family: 'Style Script', cursive;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 10px;
            transition: background-color 0.3s;
        }

        .buttons-container button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Estilos para la Vista 2 */
        .project-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .project-item {
            width: 200px;
            text-align: center;
        }

        .project-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .project-item h3 {
            margin-top: 10px;
            font-size: 1.2em;
        }

        .project-item p {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="ventana1" class="ventana">
        <h1>S. Nicolás Ramírez Villalobos</h1>
        <h1>y</h1>
        <h1>Austin Morales</h1>
    </div>

    <!-- Ventana 2 -->
    <div id="ventana2" class="ventana">
        <h1>Proyectos</h1>
        <img src="proyecto1.jpg" alt="Proyecto 1">
        <img src="proyecto2.jpg" alt="Proyecto 2">
        <img src="proyecto3.jpg" alt="Proyecto 3">
        <img src="proyecto4.jpg" alt="Proyecto 4">
    </div>

    <!-- Contenedor de botones -->
    <div class="buttons-container" id="buttons">
        <button onclick="mostrarventa(1)">Vista 2</button>
        <button onclick="mostrarventa(2)">Vista 3</button>
        <button onclick="changeContent(4)">Vista 4</button>
    </div>

    <script>
        function mostrarVentana(ventana) {
            // Ocultar todas las ventanas
            document.getElementById('ventana1').style.display = 'none';
            document.getElementById('ventana2').style.display = 'none';
            
            // Mostrar la ventana seleccionada
            if (ventana === 1) {
                document.getElementById('ventana1').style.display = 'block';
            } else if (ventana === 2) {
                document.getElementById('ventana2').style.display = 'block';
            }
        }
    </script>
</body>
</html>
